<!doctype html>
<html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{height:100%;margin:0;overflow:hidden;background:#080d15}
.stage{position:relative;display:grid;place-items:center;height:100%;overflow:hidden}
.portrait,.motion{display:block;width:100%;height:100%;object-fit:contain}
.motion{position:absolute;inset:0;opacity:0}
.stage[data-render="mesh"] .motion{opacity:1}
.stage[data-render="mesh"] .portrait{opacity:0}
</style>
<main class="stage" aria-label="Guardian, androide interattiva">
  <img class="portrait" src="data:image/jpeg;base64,__PORTRAIT__" alt="Androide femminile con volto umano e corazza scura in titanio">
  <canvas class="motion" aria-hidden="true"></canvas>
</main>
<script>
"use strict";
const stage = document.querySelector(".stage");
const portrait = document.querySelector(".portrait");
const canvas = document.querySelector(".motion");
const gl = canvas.getContext("webgl", {alpha: false, antialias: false});

function installMotion() {
  if (!gl) return;
  const vertexSource = `
    attribute vec2 vertex;
    varying vec2 uv;
    void main() { uv = vec2((vertex.x+1.0)*0.5,(1.0-vertex.y)*0.5); gl_Position = vec4(vertex,0.0,1.0); }`;
  const fragmentSource = `
    precision mediump float;
    varying vec2 uv;
    uniform sampler2D picture;
    uniform vec2 pose, crop;
    uniform float breath, jaw;
    float region(vec2 p, vec2 center, vec2 radius) {
      return 1.0 - smoothstep(0.3,1.0,length((p-center)/radius));
    }
    void main() {
      vec2 p = (uv - 0.5) / crop + 0.5;
      if (p.x<0.0 || p.x>1.0 || p.y<0.0 || p.y>1.0) {
        gl_FragColor=vec4(0.031,0.051,0.082,1.0); return;
      }
      // Keep the backdrop fixed. Move the shoulders, head and features by different amounts.
      float torso = region(p,vec2(.50,.62),vec2(.26,.42));
      float head = region(p,vec2(.502,.147),vec2(.122,.153));
      float face = region(p,vec2(.504,.166),vec2(.069,.098));
      float eyes = region(p,vec2(.505,.148),vec2(.06,.020));
      float mouth = region(p,vec2(.504,.225),vec2(.041,.031));
      vec2 turn = pose * (0.005*torso + 0.013*head + 0.014*face + 0.003*eyes);
      turn.x += pose.x * abs(p.x-.504) * .28 * face;
      turn.y += breath * (torso*.003 + head*.0015) + jaw*mouth*.005;
      vec3 color = texture2D(picture,clamp(p-turn,0.0,1.0)).rgb;
      float edge = smoothstep(0.0,.07,p.x)*smoothstep(0.0,.07,1.0-p.x);
      gl_FragColor = vec4(mix(vec3(0.031,0.051,0.082),color,edge),1.0);
    }`;

  const program = gl.createProgram();
  for (const [type, source] of [[gl.VERTEX_SHADER, vertexSource], [gl.FRAGMENT_SHADER, fragmentSource]]) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return;
    gl.attachShader(program, shader);
  }
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) return;
  gl.useProgram(program);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  const attribute=gl.getAttribLocation(program,"vertex");
  gl.enableVertexAttribArray(attribute);
  gl.vertexAttribPointer(attribute,2,gl.FLOAT,false,0,0);
  const uniforms=Object.fromEntries(["pose","crop","breath","jaw"].map(key=>[key,gl.getUniformLocation(program,key)]));
  gl.bindTexture(gl.TEXTURE_2D,gl.createTexture());
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,portrait);

  const ancestor=window.parent.document;
  const host=window.frameElement?.closest(".st-key-plancia_guardian");
  const reduced=matchMedia("(prefers-reduced-motion: reduce)");
  const limit=(value)=>Math.max(-1,Math.min(1,value));
  let targetX=0,targetY=0,x=0,y=0,gesture="",speaking=false,last=0,raf=0,visible=true;
  function aim(clientX,clientY,width,height) {
    targetX=limit((clientX-width/2)/Math.max(1,width*.34));
    targetY=limit((clientY-height*.36)/Math.max(1,height*.47));
  }
  function followPage(event) {
    const rect=window.frameElement?.getBoundingClientRect();
    if (rect) aim(event.clientX-rect.x,event.clientY-rect.y,rect.width,rect.height);
  }
  function followStage(event) { aim(event.clientX,event.clientY,stage.clientWidth,stage.clientHeight); }
  function center() { targetX=0; targetY=0; }
  ancestor.addEventListener("pointermove",followPage,{passive:true});
  ancestor.documentElement.addEventListener("pointerleave",center);
  stage.addEventListener("pointermove",followStage,{passive:true});
  window.parent.addEventListener("blur",center);

  function updateState() {
    speaking=ancestor.body.classList.contains("g-parla");
    const next=host?.querySelector(".guardian-avatar")?.dataset.movimento || "centro";
    if (next===gesture) return;
    gesture=next;
    const direction={destra:[1,0],sinistra:[-1,0],su:[0,-1],giu:[0,1],centro:[0,0]}[gesture];
    if (direction) [targetX,targetY]=direction;
  }
  const voice=new MutationObserver(updateState);
  voice.observe(ancestor.body,{attributes:true,attributeFilter:["class"]});
  const status=new MutationObserver(updateState);
  if (host) status.observe(host,{subtree:true,childList:true,attributes:true,attributeFilter:["data-movimento"]});
  const visibility=new IntersectionObserver(([entry])=>{visible=entry.isIntersecting;});
  visibility.observe(stage);
  window.addEventListener("pagehide",()=>{
    cancelAnimationFrame(raf);
    ancestor.removeEventListener("pointermove",followPage);
    ancestor.documentElement.removeEventListener("pointerleave",center);
    window.parent.removeEventListener("blur",center);
    voice.disconnect(); status.disconnect(); visibility.disconnect();
  },{once:true});
  canvas.addEventListener("webglcontextlost",()=>{cancelAnimationFrame(raf);delete stage.dataset.render;},{once:true});

  function frame(now) {
    raf=requestAnimationFrame(frame);
    if (!visible || document.hidden || now-last<30) return;
    const ratio=Math.min(1.6,devicePixelRatio);
    const width=Math.round(stage.clientWidth*ratio), height=Math.round(stage.clientHeight*ratio);
    if (!width || !height) return;
    const elapsed=last?Math.min(.12,(now-last)/1000):.03;
    last=now;
    if (canvas.width!==width || canvas.height!==height) { canvas.width=width; canvas.height=height; }
    gl.viewport(0,0,width,height);
    const smoothing=1-Math.exp(-elapsed*11);
    x=reduced.matches?0:x+(targetX-x)*smoothing;
    y=reduced.matches?0:y+(targetY-y)*smoothing;
    const aspect=(portrait.naturalWidth/portrait.naturalHeight)/(width/height);
    gl.uniform2f(uniforms.crop,Math.min(1,aspect),Math.min(1,1/aspect));
    gl.uniform2f(uniforms.pose,x,y);
    gl.uniform1f(uniforms.breath,reduced.matches?0:Math.sin(now/630));
    gl.uniform1f(uniforms.jaw,speaking&&!reduced.matches?Math.abs(Math.sin(now/69)):0);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    stage.dataset.render="mesh";
    stage.dataset.pose=x.toFixed(2)+","+y.toFixed(2);
  }
  updateState();
  raf=requestAnimationFrame(frame);
}
if (portrait.complete && portrait.naturalWidth) installMotion();
else portrait.addEventListener("load",installMotion,{once:true});
</script></html>
